<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BTC/USDT — Binance</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div class="markets" id="markets">
      <button type="button" class="market active" data-market="spot">Спот</button>
      <button type="button" class="market" data-market="futures">Фьючерсы</button>
    </div>
    <form id="symbol-form">
      <input id="symbol" value="BTCUSDT" spellcheck="false" autocomplete="off" aria-label="Пара">
    </form>
    <div id="last" class="last">—</div>
    <div id="change" class="change">—</div>
    <div class="stat"><span>Макс. 24ч</span><strong id="high">—</strong></div>
    <div class="stat"><span>Мин. 24ч</span><strong id="low">—</strong></div>
    <div class="stat"><span>Объём 24ч</span><strong id="volume">—</strong></div>
    <div id="live" class="live">Binance spot</div>
  </header>
  <nav id="pairs" aria-label="Монеты"></nav>
  <nav id="intervals" aria-label="Таймфрейм"></nav>
  <nav id="views" aria-label="Раздел">
    <button type="button" class="view active" data-view="chart">График</button>
    <button type="button" class="view" data-view="trades">Сделки</button>
    <button type="button" class="view" data-view="strategy">Стратегия</button>
  </nav>
  <div id="workspace">
  <aside id="journal">
    <strong>Сделки</strong>
    <div id="journal-list">Жду журнал</div>
  </aside>
  <div id="board">
  <aside id="desk" class="desk">
    <strong>Бумажный счёт · 2000 USDT · число монет без лимита</strong>
    <div id="desk-body">Считаю вход</div>
  </aside>
  <main>
    <div id="legend"></div>
    <div id="alert" class="alert quiet">Разбираю монету по стратегии</div>
    <div id="stage">
      <div id="chart"></div>
      <svg id="figures" aria-hidden="true"></svg>
    </div>
  </main>
  </div>
  <section id="strategy" aria-label="Стратегия">
    <div id="strategy-live">Жду поиск сигналов</div>
    <div id="strategy-body">Загружаю отчёт</div>
  </section>
  </div>
  <script src="/vendor/lightweight-charts.standalone.production.js"></script>
  <script src="/app.js"></script>
</body>
</html>
